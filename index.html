<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Trolley Problem</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      padding: 16px;
    }
    figure { margin: 0; width: min(100%, 1100px); }

    /* The scene is laid out in the coordinate space of tracks.png (1448 × 1086),
       so every position below is a percentage of that image. */
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 1448 / 1086;
      /* tracks.png has a lot of empty sky above the drawing; pull it up */
      margin-top: -12%;
      margin-bottom: -12%;
      overflow: hidden;   /* lets the trolley drive out of frame */
    }
    .scene img {
      position: absolute;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .tracks { inset: 0; width: 100%; height: 100%; filter: brightness(1.04) contrast(1.15); }

    /* Blood trail left behind the trolley. The "rails" layer uses lighten so it only
       tints the black rail lines red and leaves the white ground untouched. */
    .trail {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .trail path { fill: none; stroke: #A52F2F; stroke-linecap: round; stroke-linejoin: round; }
    .trail-rails { mix-blend-mode: lighten; }
    .trail-rails path { stroke-width: 150; }
    .trail-smear path { stroke-width: 26; opacity: 0.55; }
    .trail-smear circle { fill: #A52F2F; opacity: 0.8; }

    .trolley {
      position: absolute;
      display: block;
      aspect-ratio: 1;
      height: auto;
      overflow: visible;
      width: 22%;
      left: 1%;
      top: 17%;
      z-index: 3;
      /* point where the wheels meet the track; the animation pivots around it */
      transform-origin: 50% 78%;
      will-change: left, top, transform;
    }
    /* Blood painted onto the trolley after it hits someone; multiply keeps its outlines visible */
    .trolley-blood { opacity: 0; mix-blend-mode: multiply; transition: opacity 0.12s; }
    .trolley-blood.on { opacity: 1; }
    .trolley-blood .drip { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
                           animation: drip 1.6s ease-in forwards; }
    @keyframes drip { to { stroke-dashoffset: 0; } }

    /* Person figure's centre sits at ~53% / 54% of person-cutout.png */
    .person {
      width: 30%;
      transform: translate(-53%, -54%);
      z-index: 2;
    }
    /* dead2.png's body sits lower-left in its frame; line it up with the living figure */
    .person.dead { width: 25%; transform: translate(-44.9%, -62.5%); }
    /* Blood over a dead person; sized and placed exactly like .person.dead so it lines up with dead2.png */
    .person-blood {
      position: absolute;
      width: 25%;
      aspect-ratio: 1536 / 1024;
      transform: translate(-44.9%, -62.5%);
      z-index: 2;
      overflow: visible;
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .person-blood.on { opacity: 1; }
    .person-blood .pool ellipse { transform-box: fill-box; transform-origin: center;
                              animation: pool-spread 1.4s ease-out both; }
    @keyframes pool-spread { from { transform: scale(0); } }
    .person-blood .drip { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
                          animation: drip 1.6s ease-in forwards; }

    .operator {
      width: 19%;
      left: 21%;
      top: 54%;
      z-index: 4;
    }

    figcaption {
      position: relative;
      z-index: 5;
      text-align: center;
      font-size: clamp(14px, 2.2vw, 20px);
      margin-top: 8px;
      font-style: italic;
    }

    /* Blood splash thrown at the screen when the trolley hits someone */
    .blood-svg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 60vmax;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }
    .blood-svg.thrown { animation: splat 0.25s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes splat {
      from { transform: translate(-50%, -50%) scale(0.1) rotate(-25deg); }
      to   { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    /* Extra gore splattered across the whole screen on impact */
    .screen-gore {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
    }
    .screen-gore.on { animation: gore-life 5s forwards; }
    @keyframes gore-life { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
    .screen-gore .flash { animation: gore-flash 0.5s ease-out forwards; }
    @keyframes gore-flash { from { opacity: 0.8; } to { opacity: 0; } }
    .screen-gore .slam { transform-box: fill-box; transform-origin: center;
                         animation: gore-slam 0.22s cubic-bezier(.2, 1.7, .4, 1) both; }
    @keyframes gore-slam { from { transform: scale(0.05); } }
    body.shake figure { animation: shake 0.45s; }
    @keyframes shake {
      20% { transform: translate(-14px, 8px) rotate(-1deg); }
      40% { transform: translate(12px, -10px) rotate(1deg); }
      60% { transform: translate(-8px, 6px); }
      80% { transform: translate(5px, -3px); }
    }
  </style>
</head>

  <script>
    // Track centre lines in tracks.png pixel space (1448 × 1086).
    const SCENE_W = 1448, SCENE_H = 1086;
    const TRACK_POINTS = {
      up: [[175, 403], [460, 488], [520, 491], [600, 468], [700, 417], [780, 385],
           [850, 374], [1000, 381], [1200, 412], [1410, 447], [1750, 504]],
      down: [[175, 403], [460, 487], [650, 559], [850, 635], [1000, 680],
             [1200, 724], [1270, 739]],
    };
    // Trolley's resting box (matches the .trolley CSS) and the track point under its wheels.
    const TROLLEY_BOX = { left: 0.01 * SCENE_W, top: 0.17 * SCENE_H };
    const [START_X, START_Y] = TRACK_POINTS.down[0];
    const TILT = 0.5;          // how much the trolley rotates with the track (1 = fully)
    const DURATION = 1800;     // ms for the lower branch; other paths keep the same speed
    // Branches whose trolley leaves the frame keep accelerating instead of braking.
    const EXITS_FRAME = { up: true, down: false };

    // Smooth the control points with a Catmull-Rom spline into a dense polyline.
    function smooth(points, steps = 24) {
      const out = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i], p1 = points[i],
              p2 = points[i + 1], p3 = points[i + 2] || p2;
        for (let s = 0; s < steps; s++) {
          const t = s / steps, t2 = t * t, t3 = t2 * t;
          out.push([0, 1].map(k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t +
            (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 +
            (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
        }
      }
      out.push(points[points.length - 1]);
      return out;
    }

    function buildPath(points) {
      const pts = smooth(points), lengths = [0];
      for (let i = 1; i < pts.length; i++)
        lengths.push(lengths[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      return { pts, lengths, total: lengths[lengths.length - 1] };
    }

    // Position and track angle at distance d along the path.
    function sample({ pts, lengths }, d) {
      let i = 1;
      while (i < lengths.length - 1 && lengths[i] < d) i++;
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1);
      return { x: ax + (bx - ax) * t, y: ay + (by - ay) * t, angle: Math.atan2(by - ay, bx - ax) };
    }

    const trolley = document.querySelector('.trolley');
    const people = [...document.querySelectorAll('.person')];
    const trailPaths = [...document.querySelectorAll('.trail path')];
    const trailDrops = document.querySelector('.trail .drops');
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const RAILS_END_X = 1410;   // where the rails stop in tracks.png

    // Lays the trail along the track from distance `from` onward, hidden until drawTrail() reveals it.
    function resetTrail(path, from) {
      const pts = path.pts.filter(([x], i) => path.lengths[i] >= from && x <= RAILS_END_X);
      const d = pts.length ? 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join('L') : '';
      trailPaths.forEach(el => {
        el.setAttribute('d', d);
        el.style.strokeDasharray = el.style.strokeDashoffset = path.total;
      });
      trailDrops.replaceChildren();
    }

    // Reveals `length` of the trail and scatters drops along the newly bloodied stretch.
    function drawTrail(path, from, length) {
      trailPaths.forEach(el => el.style.strokeDashoffset = path.total - length);
      const dropsWanted = Math.floor(length / 22);
      for (let n = trailDrops.childElementCount; n < dropsWanted; n++) {
        const { x, y } = sample(path, from + n * 22 + Math.random() * 22);
        if (x > RAILS_END_X) break;
        const c = document.createElementNS(SVG_NS, 'circle');
        c.setAttribute('cx', x + (Math.random() - 0.5) * 70);
        c.setAttribute('cy', y + (Math.random() - 0.5) * 50);
        c.setAttribute('r', 3 + Math.random() * 9);
        trailDrops.append(c);
      }
    }
    const ALIVE_SRC = 'images/person-cutout.png', DEAD_SRC = 'images/dead2.png';
    new Image().src = DEAD_SRC;   // preload so the swap is instant
    let running = null;

    const blood = document.querySelector('.blood-svg');
    const trolleyBlood = document.querySelector('.trolley-blood');
    const gore = trolleyBlood.querySelector('.gore');
    const BLOOD_REDS = ['#A52F2F', '#8E2424', '#6E1717', '#B83A3A'];
    const rand = (a, b) => a + Math.random() * (b - a);

    // Areas of the trolley (in trolley.png pixels) that take the hit: the front face and the lower side.
    function goreSpot() {
      return Math.random() < 0.6
        ? { x: rand(880, 1190), y: rand(520, 1050) }
        : { x: rand(110, 900), y: rand(560, 1010) };
    }

    function svgEl(tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    // Covers the trolley in random blobs and running drips.
    function bloodyTrolley() {
      gore.replaceChildren();
      for (let i = 0; i < 130; i++) {
        const { x, y } = goreSpot();
        gore.append(svgEl('ellipse', {
          cx: x, cy: y, rx: rand(8, 60), ry: rand(6, 40),
          transform: `rotate(${rand(-40, 40)} ${x} ${y})`,
          fill: BLOOD_REDS[i % BLOOD_REDS.length], opacity: rand(0.7, 1),
        }));
      }
      for (let i = 0; i < 50; i++) {
        const { x, y } = goreSpot();
        const drip = svgEl('path', {
          class: 'drip', pathLength: 1,
          d: `M${x} ${y} q${rand(-6, 6)} ${rand(40, 90)} ${rand(-4, 4)} ${rand(60, 200)}`,
          stroke: BLOOD_REDS[i % BLOOD_REDS.length], 'stroke-width': rand(10, 26),
        });
        drip.style.animationDelay = rand(0, 0.8) + 's';
        gore.append(drip);
      }
      trolleyBlood.classList.add('on');
    }

    const screenGore = svgEl('svg', { class: 'screen-gore', preserveAspectRatio: 'xMidYMid slice', 'aria-hidden': 'true' });
    document.body.append(screenGore);

    // Restarts a CSS animation class on an element.
    function replay(el, cls) {
      el.classList.remove(cls);
      void el.getBoundingClientRect();
      el.classList.add(cls);
    }

    // Covers the viewport in splatter and specks, and shakes the scene.
    function goreScreen() {
      const { width: W, height: H } = screenGore.getBoundingClientRect(), k = Math.max(W, H) / 1200;
      screenGore.setAttribute('viewBox', `0 0 ${W} ${H}`);
      screenGore.replaceChildren(svgEl('rect', { class: 'flash', x: -W, y: -H, width: 3 * W, height: 3 * H, fill: '#8B0000' }));

      for (let i = 0; i < 6; i++) {
        const scale = rand(0.35, 0.95) * k, x = rand(-0.1, 0.9) * W, y = rand(-0.1, 0.7) * H;
        const g = svgEl('g', { transform: `translate(${x} ${y}) rotate(${rand(-180, 180)}) scale(${scale})` });
        const splat = svgEl('use', { href: '#splatter', class: 'slam' });
        splat.style.animationDelay = rand(0, 0.15) + 's';
        if (i % 2) splat.style.filter = 'brightness(0.65)';   // darker, clotted layers
        g.append(splat);
        screenGore.append(g);
      }
      for (let i = 0; i < 70; i++) {
        const r = rand(3, 26) * k, x = rand(0, W), y = rand(0, H);
        const speck = svgEl('ellipse', {
          class: 'slam', cx: x, cy: y, rx: r, ry: r * rand(0.5, 1),
          fill: BLOOD_REDS[i % BLOOD_REDS.length], opacity: rand(0.75, 1),
        });
        speck.style.animationDelay = rand(0, 0.2) + 's';
        screenGore.append(speck);
      }
      replay(screenGore, 'on');
      replay(document.body, 'shake');
    }

    function cleanTrolley() {
      trolleyBlood.classList.remove('on');
      gore.replaceChildren();
    }

    // Pops the splash toward the viewer, then lets it drip and fade (SMIL from the CodePen).
    function splashBlood() {
      blood.classList.remove('thrown');
      void blood.getBoundingClientRect();   // restart the CSS pop if it's already applied
      blood.classList.add('thrown');
      ['splash-fade', 'splash-drip-a', 'splash-drip-b'].forEach(id => document.getElementById(id).beginElement());
    }

    // One blood overlay per person, clipped to the outline of dead2.png (1536 × 1024).
    people.forEach((person, i) => {
      const svg = svgEl('svg', { class: 'person-blood', viewBox: '0 0 1536 1024', 'aria-hidden': 'true' });
      svg.style.left = person.style.left;
      svg.style.top = person.style.top;
      svg.innerHTML = `
        <defs>
          <mask id="dead-shape-${i}" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024">
            <image href="${DEAD_SRC}" width="1536" height="1024"/>
          </mask>
        </defs>
        <g class="pool"/>
        <g class="gore" mask="url(#dead-shape-${i})"/>`;
      person.after(svg);
      person.blood = svg;
    });

    // The body in dead2.png runs from the feet (330, 860) up to the head (1000, 480).
    function bodySpot(spread) {
      const t = Math.random(), off = (Math.random() - 0.5) * spread;
      return { x: 330 + 670 * t + off * 0.49, y: 860 - 380 * t + off * 0.87 };
    }

    function bloodyBody(person) {
      const pool = person.blood.querySelector('.pool'), gore = person.blood.querySelector('.gore');
      pool.replaceChildren();
      gore.replaceChildren();
      // pool on the ground, lying along the body
      for (let i = 0; i < 9; i++) {
        const { x, y } = bodySpot(360);
        // the rotation lives on a wrapper so the CSS spread animation (a transform) can't override it
        const tilt = svgEl('g', { transform: `rotate(-30 ${x} ${y + 40})` });
        const el = svgEl('ellipse', {
          cx: x, cy: y + 40, rx: rand(160, 300), ry: rand(70, 130),
          fill: BLOOD_REDS[1 + i % 3], opacity: 0.85,
        });
        el.style.animationDelay = rand(0, 0.4) + 's';
        tilt.append(el);
        pool.append(tilt);
      }
      gore.append(svgEl('use', { href: '#splatter', transform: 'translate(430 420) scale(0.65) rotate(-20)' }));
      for (let i = 0; i < 80; i++) {
        const { x, y } = bodySpot(220);
        gore.append(svgEl('ellipse', {
          cx: x, cy: y, rx: rand(8, 45), ry: rand(6, 30),
          transform: `rotate(${rand(-60, 20)} ${x} ${y})`,
          fill: BLOOD_REDS[i % BLOOD_REDS.length], opacity: rand(0.7, 1),
        }));
      }
      for (let i = 0; i < 18; i++) {
        const { x, y } = bodySpot(200);
        const drip = svgEl('path', {
          class: 'drip', pathLength: 1,
          d: `M${x} ${y} q${rand(-5, 5)} ${rand(30, 60)} ${rand(-3, 3)} ${rand(50, 130)}`,
          stroke: BLOOD_REDS[i % BLOOD_REDS.length], 'stroke-width': rand(8, 18),
        });
        drip.style.animationDelay = rand(0, 0.8) + 's';
        gore.append(drip);
      }
    }

    function setDead(person, dead) {
      person.src = dead ? DEAD_SRC : ALIVE_SRC;
      person.classList.toggle('dead', dead);
      if (dead) bloodyBody(person);
      person.blood.classList.toggle('on', dead);
    }

    function placeTrolley(x, y, rotateDeg) {
      trolley.style.left = ((TROLLEY_BOX.left + x - START_X) / SCENE_W * 100) + '%';
      trolley.style.top = ((TROLLEY_BOX.top + y - START_Y) / SCENE_H * 100) + '%';
      trolley.style.transform = `rotate(${rotateDeg}deg)`;
    }

    /**
     * Drive the trolley from the start to the end of the chosen branch.
     * @param {'up'|'down'} direction  which branch to take at the fork
     * @returns {Promise<void>} resolves when the trolley reaches the end
     */
    function startTrolley(direction = 'down') {
      if (!TRACK_POINTS[direction]) throw new Error(`direction must be "up" or "down", got "${direction}"`);
      if (running) cancelAnimationFrame(running);

      const path = buildPath(TRACK_POINTS[direction]);
      const startAngle = sample(path, 0).angle;
      const ease = EXITS_FRAME[direction]
        ? t => t * t                       // speed up and keep going
        : t => t * t * (3 - 2 * t);        // gentle start and stop
      const duration = DURATION * path.total / buildPath(TRACK_POINTS.down).total;

      people.forEach(p => setDead(p, false));
      cleanTrolley();
      const victim = people.find(p => p.dataset.track === direction);
      const victimX = parseFloat(victim.style.left) / 100 * SCENE_W;
      // the trail starts just behind the person's body
      const trailFrom = path.lengths[path.pts.findIndex(([x]) => x >= victimX - 90)];
      resetTrail(path, trailFrom);

      return new Promise(resolve => {
        const t0 = performance.now();
        const frame = now => {
          const t = Math.min((now - t0) / duration, 1);
          const dist = ease(t) * path.total;
          const p = sample(path, dist);
          placeTrolley(p.x, p.y, (p.angle - startAngle) * TILT * 180 / Math.PI);
          // the trolley's front is well ahead of its wheel point, so it covers the person here
          if (p.x >= victimX - 40 && !victim.classList.contains('dead')) {
            setDead(victim, true);
            splashBlood();
            goreScreen();
            bloodyTrolley();
          }
          if (victim.classList.contains('dead')) drawTrail(path, trailFrom, dist - trailFrom);
          if (t < 1) running = requestAnimationFrame(frame);
          else { running = null; resolve(); }
        };
        running = requestAnimationFrame(frame);
      });
    }

    window.startTrolley = startTrolley;
  </script>
</body>
</html>
